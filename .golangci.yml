# Managed by ergon init, with .ergon/local/.golangci.yml merged in. Change the repository's settings there and run ergon init sync.
#
# The configuration of golangci-lint for every module of the repository. It enables each linter
# that a Go repository of the baseline enables, with the strictest setting that one of them uses.
# A repository adds its own settings in its local file, which merges into this one: maps key by
# key, lists appended. The depguard rules of the repository's module boundaries go there.

version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true
  relative-path-mode: gomod
output:
  show-stats: true
  sort-order:
    - linter
    - severity
    - file
linters:
  default: none
  enable:
    # Correctness
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - gosec
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnil
    - predeclared
    - reassign
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    # Modernization
    - modernize
    - unparam
    # Performance
    - bodyclose
    - gocritic
    - mirror
    - noctx
    - perfsprint
    - prealloc
    # Architecture and style
    - decorder
    - depguard
    - dupl
    - dupword
    - forbidigo
    - funcorder
    - goconst
    - interfacebloat
    - misspell
    - musttag
    - nolintlint
    - revive
    - sloglint
    - usestdlibvars
    - whitespace
    - wrapcheck
    # Concurrency
    - asasalint
    - containedctx
    - contextcheck
    - errname
    - fatcontext
    - spancheck
    # Test hygiene
    - paralleltest
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - usetesting
    # The analyzers of go.lint.analyzers and the module plugins of go.lint.plugins, which ergon tool
    # run builds into golangci-lint
    - errorprefix
    - skipexpiry
  settings:
    asasalint:
      use-builtin-exclusions: true
    copyloopvar:
      check-alias: true
    # golangci-lint loads each analyzer and module plugin from its program. A repository sets the
    # settings of a plugin in its local file, under the name of the plugin.
    custom:
      errorprefix:
        type: module
      skipexpiry:
        type: module
    decorder:
      disable-dec-order-check: true
      disable-init-func-first-check: false
    # depguard allows only the standard library in a module without rules, so this rule denies
    # the packages that the standard library or a successor replaces, and allows everything else.
    # A repository adds the rules of its module boundaries in its local file.
    depguard:
      rules:
        replaced:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: io/ioutil$
              desc: io/ioutil is deprecated, so use io and os
            - pkg: github.com/pkg/errors
              desc: wrap with fmt.Errorf and %w, and match with errors.Is and errors.As
            - pkg: golang.org/x/exp/slices$
              desc: use slices of the standard library
            - pkg: golang.org/x/exp/maps$
              desc: use maps of the standard library
            - pkg: golang.org/x/net/context$
              desc: use context of the standard library
            - pkg: github.com/golang/protobuf
              desc: github.com/golang/protobuf is deprecated, so use google.golang.org/protobuf
        # The root module imports only the standard library, core, kanon, xxhash and its
        # own packages. A conformance kit is a package whose name ends in test.
        root-module:
          list-mode: strict
          files:
            - $all
            - "!$test"
            - "!**/*test/*.go"
          allow:
            - $gostd
            - go.thesmos.sh/core
            - go.thesmos.sh/kanon
            - github.com/cespare/xxhash/v2
            - go.thesmos.sh/sharder
        # The tests and the conformance kits of the root module also import assert, and
        # conform for the options of the applications of the generated suites.
        root-module-tests:
          list-mode: strict
          files:
            - $test
            - "**/*test/*.go"
          allow:
            - $gostd
            - go.thesmos.sh/core
            - go.thesmos.sh/kanon
            - github.com/cespare/xxhash/v2
            - go.thesmos.sh/sharder
            - go.dokimi.dev/assert
            - go.dokimi.dev/conform
        # Package shard imports no other package of sharder, so every package can import
        # it.
        shard:
          list-mode: lax
          files:
            - "**/shard/*.go"
          allow:
            - go.thesmos.sh/sharder/shard
          deny:
            - pkg: go.thesmos.sh/sharder
              desc: package shard imports no other package of sharder
        # The strategy packages and their subpackages do not import the registry, the
        # components or an internal package, so an application uses a strategy without
        # them. The entry replica$ and the entry replica/ leave replication allowed.
        strategies:
          list-mode: lax
          files:
            - "**/partition/**.go"
            - "**/placement/**.go"
            - "**/replication/**.go"
            - "**/ownership/**.go"
            - "**/handoff/**.go"
            - "**/fence/**.go"
            - "**/budget/**.go"
            - "!$test"
          deny:
            - pkg: go.thesmos.sh/sharder/builtin
              desc: a strategy package does not import the registry of the built-ins
            - pkg: go.thesmos.sh/sharder/config
              desc: a strategy package does not import the registry
            - pkg: go.thesmos.sh/sharder/controller
              desc: a strategy package does not import a component
            - pkg: go.thesmos.sh/sharder/replica$
              desc: a strategy package does not import a component
            - pkg: go.thesmos.sh/sharder/replica/
              desc: a strategy package does not import a component
            - pkg: go.thesmos.sh/sharder/router
              desc: a strategy package does not import a component
            - pkg: go.thesmos.sh/sharder/sim
              desc: a strategy package does not import a component
            - pkg: go.thesmos.sh/sharder/internal
              desc: a strategy package does not import an internal package
        # The examples use only the exported API of the root module, as an application does.
        examples:
          list-mode: lax
          files:
            - "**/examples/**/*.go"
          deny:
            - pkg: go.thesmos.sh/sharder/internal
              desc: an example uses only the exported API of the root module
    exhaustive:
      default-signifies-exhaustive: true
      check:
        - switch
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: return an error instead of a panic
        - pattern: ^(fmt\.(Print|Printf|Println)|print|println)$
          msg: write to an io.Writer that the caller passes, or log through log/slog
    funcorder:
      constructor: true
      struct-method: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
    govet:
      enable-all: true
    interfacebloat:
      max: 10
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      severity: error
      confidence: 0.1
      rules:
        - name: blank-imports
        # thelper requires the test first in a helper, so a helper takes its context second.
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redundant-import-alias
        - name: time-naming
        - name: unexported-return
        - name: unnecessary-stmt
        - name: unused-receiver
        - name: var-naming
    # revive checks the package comments and the names, so staticcheck runs every other check.
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
    # Every test file declares the package x_test, so a test calls only what its package exports.
    # The pattern matches no file name, and an empty pattern would match every one.
    testpackage:
      skip-regexp: "^$"
    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
      os-mkdir-temp: true
      os-temp-dir: true
    whitespace:
      multi-if: true
      multi-func: false
    # An error that the constructor of an error, a wrap, a join or a context returns already
    # carries its cause, and a walk of a file tree returns the error of the caller's own function,
    # so neither needs a second wrap.
    wrapcheck:
      ignore-sig-regexps:
        - \.New.*Error\(
        - \.(Wrap|Wrapf)\(
        - errors\.(Join|Unwrap)\(
        - \.Err\(
        - context\.Cause\(
        - (fs|filepath)\.WalkDir\(
        - filepath\.Walk\(
        - errs\.WithClass\(
        - machine\.ClassifyAttempt\(
    # G115 analyses each function alone. The sharder bounds each count where it validates a
    # configuration or a range, so G115 reports conversions of values that an earlier check
    # bounds.
    gosec:
      excludes:
        - G115
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    paths:
      - (^|/)testdata($|/)
    rules:
      # A table or a fixture of a test exists once per test, so its layout and its size do not
      # matter.
      - path: _test\.go$
        linters: [govet]
        text: "fieldalignment:"
      - path: _test\.go$
        linters: [gocritic]
        text: "(hugeParam|rangeValCopy):"
      # A test states its values inline, because the value is the assertion.
      - path: _test\.go$
        linters: [goconst, gosec]
      # A failed type assertion or an unused parameter in a test fails the test, which is the
      # signal these linters exist for.
      - path: _test\.go$
        linters: [forcetypeassert, unparam]
      # A test file puts its fakes and helpers below the tests that use them, in reading order.
      - path: _test\.go$
        linters: [funcorder]
      # A fake of a test returns a nil value with a nil error on purpose, to prove the guard
      # against a broken value-or-error contract.
      - path: _test\.go$
        linters: [nilnil]
      # A spec mirrors its source file, so the specs of two similar files repeat each other.
      - path: _test\.go$
        linters: [dupl]
      # A test and the code of a generator return the errors of the code that they call unchanged.
      # A test checks such an error with errors.Is, and a generator has no context to add.
      - path: (_test|[._]gen)\.go$
        linters: [wrapcheck]
      # A test of an allocation ceiling, of an environment variable or of the test binary as a
      # process runs serially, and its name ends in Allocs, Env or Process.
      # testing.AllocsPerRun and t.Setenv panic in a parallel test, and two processes that exit
      # in the same nanosecond write one coverage file.
      - path: _test\.go$
        linters: [paralleltest, tparallel]
        text: 'Test\w*(Allocs|Env|Process)\b'
      # The conformance kits, such as partitiontest, run only inside tests, so the reasons of
      # the test rules apply to them. A planted defect returns the errors of the
      # implementation that it wraps unchanged, which a check matches with errors.Is.
      - path: (^|/)\w+test/
        linters: [wrapcheck]
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  # gci groups the standard library apart from every other import. A repository puts its own
  # modules in a group of their own by adding gci's sections in its local file, such as standard,
  # default and the prefix of its module paths.
  settings:
    gofumpt:
      extra:
        group-params: true
    # golines keeps each struct tag as it is written. Its default, reformat-tags, pads the keys of
    # the tags of a struct into columns.
    golines:
      max-len: 120
      reformat-tags: false
    # The packages of the sharder form an import group of their own.
    gci:
      sections:
        - standard
        - default
        - prefix(go.thesmos.sh/sharder)
      custom-order: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  fix: false
severity:
  default: error
