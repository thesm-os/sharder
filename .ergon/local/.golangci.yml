# The settings of the sharder, which ergon init merges into .golangci.yml.

formatters:
  settings:
    # The packages of the sharder form an import group of their own.
    gci:
      sections:
        - standard
        - default
        - prefix(go.thesmos.sh/sharder)
      custom-order: true
